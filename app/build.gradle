apply plugin: 'com.android.application'

android {
    namespace 'com.minidroid'
    compileSdk 33

    defaultConfig {
        applicationId "com.minidroid"
        minSdk 14
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
